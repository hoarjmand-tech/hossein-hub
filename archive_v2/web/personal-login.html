<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ورود به همراه من</title><style>@font-face{font-family:p;src:url('/font-persian-regular.ttf')}*{box-sizing:border-box}body{font-family:p, sans-serif;background:#f6f7fb;min-height:100dvh;display:grid;place-items:center;margin:0;padding:24px;color:#182033}form{width:min(100%,380px);padding:32px;border-radius:28px;background:white;box-shadow:0 20px 70px #5b6ff722}input,button{font:inherit;width:100%;padding:14px;border-radius:14px;margin-top:16px;border:1px solid #e2e5f0}button{background:#5b6ff7;color:white;border:0}p{font-size:13px;color:#768096;line-height:2}#error{color:#be3e4e}</style><form id="login"><h1>همراه من ✦</h1><p>فضای شخصی تو برای کارها، صداها و پیگیری‌های روزانه.</p><input id="password" type="password" required autocomplete="current-password" placeholder="رمز دستیار شخصی" aria-label="رمز"><button>ورود</button><p id="error" role="alert"></p></form><script>document.getElementById('login').onsubmit=async e=>{e.preventDefault();const error=document.getElementById('error');if(!isSecureContext){error.textContent='برای ورود امن، آدرس HTTPS برنامه را باز کن.';return}try{const r=await fetch('/api/personal/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('password').value})});const d=await r.json();if(!r.ok)throw Error(d.detail);location.reload()}catch(x){error.textContent=x.message}};</script></html>
