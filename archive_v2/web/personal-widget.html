<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#5b6ff7"><title>نمای سریع امروز</title><style>@font-face{font-family:p;src:url('/font-persian-regular.ttf')}*{box-sizing:border-box}body{font-family:p,sans-serif;background:#edf0fa;margin:0;color:#172039;padding:20px}main{max-width:460px;margin:20px auto;background:white;border-radius:30px;overflow:hidden;box-shadow:0 18px 60px #5064b520}header{padding:24px;background:linear-gradient(120deg,#586ef5,#8d5cf6);color:white}h1{font-size:22px;margin:0}p{font-size:12px}section{padding:20px}article{padding:12px 0;border-bottom:1px solid #edf0f5;display:flex;gap:10px;align-items:center}button,a,input{font:inherit}button,a{border:0;border-radius:12px;padding:10px;background:#eef0ff;color:#4e61d2;text-decoration:none;cursor:pointer}input{width:100%;border:1px solid #e0e5f1;border-radius:12px;padding:12px;margin-bottom:10px}small{color:#738098}footer{display:flex;gap:8px;margin-top:20px}#msg{font-size:12px;color:#b54a45}</style><main><header><h1>امروز، در یک نگاه ✦</h1><p id="counts">در حال دریافت…</p></header><section><div id="tasks"></div><footer><a href="/personal">باز کردن دستیار</a><button id="refresh">تازه‌سازی</button></footer><p>ثبت سریع</p><input id="text" placeholder="چه چیزی را نباید فراموش کنم؟" aria-label="یادداشت سریع"><button id="save">افزودن به ورودی</button><p id="msg" role="status"></p><small>نمای وب جمع‌وجور؛ این صفحه ویجت بومی iOS نیست.</small></section></main><script>
const get=id=>document.getElementById(id);async function call(url,body){const r=await fetch(url,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{});if(r.status===401){location.reload();throw Error('ورود لازم است')}const d=await r.json();if(!r.ok)throw Error(d.detail);return d}
async function load(){try{const d=await call('/api/personal/dashboard');get('counts').textContent=`${d.counts.today} کار امروز · ${d.counts.overdue} عقب‌افتاده · ${d.counts.waiting} منتظر پاسخ`;get('tasks').replaceChildren();for(const t of d.focus.slice(0,3)){const row=document.createElement('article');const a=document.createElement('a');a.href='/personal';a.textContent=t.title;row.append(a);get('tasks').append(row)}if(!d.focus.length)get('tasks').textContent='کاری برای امروز ثبت نشده است.'}catch(e){get('msg').textContent=e.message}}
get('refresh').onclick=load;get('save').onclick=async()=>{try{if(!get('text').value.trim())return;await call('/api/personal/capture',{text:get('text').value});get('text').value='';get('msg').textContent='ثبت شد';load()}catch(e){get('msg').textContent=e.message}};load();document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});
</script></html>
