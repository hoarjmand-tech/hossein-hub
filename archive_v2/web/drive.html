<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Google Drive · دستیار من</title><style>body{margin:0;background:#f4f6fb;color:#172039;font-family:Tahoma,Arial,sans-serif}.wrap{max-width:900px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.top h1{font-size:22px;margin:0}.top a{background:#fff;border:1px solid #e4e7ef;border-radius:12px;padding:10px 14px;text-decoration:none;color:#5368db;font-size:12px}.bar{display:flex;gap:8px;align-items:center;background:#fff;border-radius:16px;padding:12px;margin-bottom:14px;border:1px solid #e5e8ef}.crumb{flex:1;color:#66728b;font-size:12px}.back,.refresh{border:0;border-radius:10px;background:#eef0ff;color:#5267db;padding:8px 11px;font:inherit;font-size:11px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card{background:#fff;border:1px solid #e5e8ef;border-radius:16px;padding:13px;display:flex;gap:10px;align-items:center;min-height:72px}.icon{width:42px;height:48px;border-radius:11px;background:#eef0ff;display:grid;place-items:center;font-size:23px;flex:none}.body{min-width:0;flex:1}.body b{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.body small{display:block;color:#8490a5;font-size:10px;margin-top:5px}.actions{display:flex;gap:5px}.btn{border:0;border-radius:9px;padding:7px 8px;background:#eef0ff;color:#5267db;font:inherit;font-size:10px}.btn.import{background:#e9f9f3;color:#158866}.empty,.error{padding:30px;text-align:center;color:#7b879b;background:#fff;border-radius:16px}.error{color:#c5544c}@media(max-width:600px){.grid{grid-template-columns:1fr}.top h1{font-size:18px}}</style></head><body><div class="wrap"><header class="top"><h1>Google Drive</h1><a href="/">⌂ صفحه اصلی</a></header><div class="bar"><button class="back" onclick="goBack()">→ برگشت</button><div id="crumb" class="crumb">در حال بارگذاری…</div><button class="refresh" onclick="load()">تازه‌سازی</button></div><main id="list" class="grid"></main></div><script>let current='';const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const box=$('list');box.innerHTML='<div class="empty">در حال دریافت از Google Drive…</div>';try{const r=await fetch('/api/drive/browse?folder_id='+encodeURIComponent(current));const d=await r.json();if(!r.ok)throw Error(d.detail||'خطا در اتصال');$('crumb').textContent=d.path||'Google Drive';const rows=d.items||[];box.innerHTML=rows.length?rows.map(x=>{const folder=x.mimeType==='application/vnd.google-apps.folder';const icon=folder?'📁':x.mimeType==='application/pdf'?'📄':x.mimeType?.startsWith('image/')?'🖼️':'📎';return '<article class="card"><div class="icon">'+icon+'</div><div class="body"><b>'+esc(x.name)+'</b><small>'+esc(folder?'فولدر':x.mimeType||'فایل')+'</small></div><div class="actions">'+(folder?'<button class="btn" onclick="openFolder(\''+x.id+'\')">بازکردن</button>':'<button class="btn import" onclick="importFile(\''+x.id+'\')">افزودن به آرشیو</button>')+'</div></article>'}).join(''):'<div class="empty">این فولدر خالی است.</div>'}catch(e){box.innerHTML='<div class="error">'+esc(e.message)+'</div>'}}function openFolder(id){current=id;load()}function goBack(){current='';load()}async function importFile(id){try{const r=await fetch('/api/drive/import',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({file_id:id})});const d=await r.json();if(!r.ok)throw Error(d.detail||'ثبت ناموفق بود');alert(d.duplicate?'این فایل قبلاً در آرشیو وجود دارد':'فایل مستقیماً وارد آرشیو شد')}catch(e){alert(e.message)}}load();</script></body></html>
