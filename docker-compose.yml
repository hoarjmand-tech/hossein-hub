services:
  postgres:
    image: postgres:16-alpine
    container_name: hossein-hub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes:
      - ./postgres:/var/lib/postgresql/data
    networks: [hub-backend]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
  archive-api:
    build: ./app/backend
    container_name: hossein-hub-archive
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      HUB_API_KEY_FILE: /run/secrets/hub_api_key
      ARCHIVE_ROOT: /archive
    secrets: [postgres_password,hub_api_key]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./archive:/archive
    expose: ["8080"]
    networks: [hub-backend]
  ocr-worker:
    build: ./app/backend
    container_name: hossein-hub-ocr
    restart: unless-stopped
    command: ["python","-m","app.worker"]
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      ARCHIVE_ROOT: /archive
    secrets: [postgres_password]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./archive:/archive
    networks: [hub-backend]

  nginx:
    image: nginx:1.27-alpine
    container_name: hossein-hub-nginx
    restart: unless-stopped
    depends_on: [archive-api]
    volumes:
      - ./config/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "192.168.1.35:8080:80"
    networks: [hub-backend]
  tailscale:
    image: tailscale/tailscale:stable
    container_name: hossein-hub-tailscale
    hostname: hossein-hub
    restart: unless-stopped
    network_mode: host
    environment:
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
      TS_AUTH_ONCE: "true"
    volumes:
      - ./data/tailscale:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  hub_api_key:
    file: ./secrets/hub_api_key
networks:
  hub-backend:
    external: true
    name: hossein-hub-backend
