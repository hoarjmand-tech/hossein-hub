services:
  archive:
    build: ./archive_v2
    container_name: hossein-archive
    restart: unless-stopped
    environment:
      ARCHIVE_ROOT: /data
      DRIVE_PUSH_TOKEN_FILE: /run/secrets/drive_push_token
      COOKIE_SECURE: "false"
      MAX_UPLOAD_MB: "100"
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://192.168.1.35:8188}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ALLOWED_USERS: ${TELEGRAM_ALLOWED_USERS:-}
      TELEGRAM_INIT_MAX_AGE: ${TELEGRAM_INIT_MAX_AGE:-86400}
    secrets:
      - drive_push_token
    volumes:
      - ./archive_data:/data
    ports:
      - "0.0.0.0:8188:8080"
    healthcheck:
      test: ["CMD-SHELL","curl -fsS http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  document-intake:
    build: ./intake-worker
    container_name: hossein-hub-document-intake
    restart: unless-stopped
    environment:
      ARCHIVE_API: http://archive:8080
      INBOX_PATH: /inbox
      PROCESSED_PATH: /processed
      ERROR_PATH: /errors
      SCAN_INTERVAL: "5"
      STABLE_SECONDS: "8"
      MAX_FILE_MB: "100"
    volumes:
      - ./scanner_inbox:/inbox
      - ./scanner_processed:/processed
      - ./scanner_errors:/errors
    depends_on:
      archive:
        condition: service_healthy

  telegram-bot:
    build: ./telegram-bot
    container_name: hossein-hub-telegram-bot
    restart: unless-stopped
    environment:
      ARCHIVE_API: http://archive:8080
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://192.168.1.35:8188}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ALLOWED_USERS: ${TELEGRAM_ALLOWED_USERS:-}
      TELEGRAM_MINI_APP_URL: ${TELEGRAM_MINI_APP_URL:-}
    depends_on:
      archive:
        condition: service_healthy

  telegram-gateway:
    image: nginx:1.27-alpine
    container_name: hossein-hub-telegram-gateway
    restart: unless-stopped
    volumes:
      - ./telegram-gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "0.0.0.0:8081:8081"
    depends_on:
      archive:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  tailscale:
    image: tailscale/tailscale:stable
    container_name: hossein-hub-tailscale
    hostname: hossein-hub
    restart: unless-stopped
    network_mode: host
    environment:
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
      TS_AUTH_ONCE: "true"
    volumes:
      - ./data/tailscale:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE

secrets:
  drive_push_token:
    file: ./secrets/drive_push_token
