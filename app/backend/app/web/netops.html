<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NetOps Control Center</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial;background:#eef2f7;color:#0f172a}header{background:#0f172a;color:#fff;padding:18px}.w{max-width:1200px;margin:auto;padding:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.p{background:#fff;border-radius:14px;padding:16px;border:1px solid #e2e8f0;margin-bottom:14px}select,textarea,button,input{font:inherit;width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:9px;margin:5px 0}textarea{min-height:130px;font-family:monospace;direction:ltr;text-align:left}button{background:#0f172a;color:#fff;cursor:pointer}.warn{color:#991b1b}.ok{color:#166534}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #e2e8f0;text-align:right;font-size:13px}pre{white-space:pre-wrap;max-height:420px;overflow:auto;background:#f8fafc;padding:10px;border-radius:8px;direction:ltr;text-align:left}@media(max-width:850px){.grid{grid-template-columns:1fr}}</style></head><body>
<header><a href="/" style="color:white">← اصلی</a>　<b>NetOps Control Center</b></header><main class="w">
<div class="p"><b>Change Pipeline:</b> Pre-check → Backup → Change → Post-check → Validation → Rollback on failure</div>
<div class="grid">
<section class="p"><h2>اجرای تغییر</h2><label>Device</label><select id="device"></select><label>Pre-check commands</label><textarea id="pre" placeholder="show version&#10;show ip interface brief"></textarea><label>Change commands</label><textarea id="cmd" placeholder="interface Gi1/0/1&#10;description UPLINK&#10;no shutdown"></textarea><label>Post-check commands</label><textarea id="post" placeholder="show running-config interface Gi1/0/1"></textarea><label>Rollback commands</label><textarea id="rb" placeholder="interface Gi1/0/1&#10;shutdown"></textarea><button onclick="submitJob()">Queue Change</button><div id="msg"></div></section>
<section class="p"><h2>آخرین Jobها</h2><table><thead><tr><th>Device</th><th>Status</th><th>Time</th></tr></thead><tbody id="jobs"></tbody></table></section>
</div>
<section class="p"><h2>Job Detail</h2><pre id="detail">یک Job را انتخاب کن.</pre></section>
</main><script>
let CSRF="";async function api(u,o={}){if(o.method&&o.method!=="GET")o.headers={...(o.headers||{}),"Content-Type":"application/json","X-CSRF-Token":CSRF};let r=await fetch(u,o);if(r.status===401){location="/archive";throw 0}if(!r.ok)throw Error(await r.text());return r.json()}
function lines(x){return x.split("\n").map(z=>z.trim()).filter(Boolean)}
async function init(){let m=await api("/api/auth/me");CSRF=m.csrf;if(!m.admin){document.body.innerHTML="<main class='w'><div class='p warn'>Admin access required.</div></main>";return}let d=await api("/api/netops/devices");device.innerHTML=d.map(x=>"<option value='"+x.id+"'>"+x.name+" — "+x.host+" — "+x.device_type+"</option>").join("");loadJobs()}
async function submitJob(){msg.textContent="";try{let x=await api("/api/netops/jobs",{method:"POST",body:JSON.stringify({device_id:device.value,commands:lines(cmd.value),precheck:lines(pre.value),postcheck:lines(post.value),rollback:lines(rb.value)})});msg.innerHTML="<span class='ok'>Queued: "+x.job_id+"</span>";loadJobs()}catch(e){msg.innerHTML="<span class='warn'>"+e.message+"</span>"}}
async function loadJobs(){let x=await api("/api/netops/jobs");jobs.innerHTML=x.map(z=>"<tr onclick=\"showJob('"+z.id+"')\" style='cursor:pointer'><td>"+z.device_name+"</td><td>"+z.status+"</td><td>"+(z.created_at||"")+"</td></tr>").join("")}
async function showJob(id){let x=await api("/api/netops/jobs/"+id);detail.textContent=JSON.stringify(x,null,2)}
setInterval(loadJobs,5000);init();
</script></body></html>
