<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Assistant Search</title><style>*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial;background:#eef2f7;color:#0f172a}header{background:#0f172a;color:#fff;padding:18px}.w{max-width:1100px;margin:auto;padding:18px}.p{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:16px;margin:12px 0}.row{display:flex;gap:8px;flex-wrap:wrap}input,button{font:inherit;padding:10px;border-radius:9px;border:1px solid #cbd5e1}button{background:#0f172a;color:#fff;cursor:pointer}.muted{color:#64748b}.bad{color:#991b1b}.ok{color:#166534}a{color:inherit}</style></head><body><header><a href="/" style="color:white">← صفحه اصلی</a>　<b>Assistant Search</b></header><main class="w"><div class="p"><h2>جستجوی یکپارچه</h2><div class="row"><input id="q" style="flex:1" placeholder="نام سند، متن OCR، IP، سرور، هشدار..."><button onclick="search()">جستجو</button></div></div><div id="out"></div></main><script>let CSRF="";async function api(u,o={}){if(o.method&&o.method!=="GET")o.headers={...(o.headers||{}),"X-CSRF-Token":CSRF};let r=await fetch(u,o);if(r.status===401){location="/archive";throw 0}if(!r.ok)throw Error(await r.text());return r}async function boot(){let r=await fetch("/api/auth/me");if(!r.ok){location="/archive";return}CSRF=(await r.json()).csrf;await run()}async function run(){} async function search(){let v=q.value.trim();if(v.length<2)return;let x=await(await api("/api/assistant/search?q="+encodeURIComponent(v))).json();out.innerHTML="<div class='p'><h3>اسناد</h3>"+x.documents.map(z=>"<div>"+z.title+" — "+z.category+"</div>").join("")+"</div><div class='p'><h3>تجهیزات</h3>"+x.assets.map(z=>"<div>"+z.name+" — "+z.address+" — "+z.status+"</div>").join("")+"</div><div class='p'><h3>هشدارها</h3>"+x.alerts.map(z=>"<div>"+z.title+" — "+z.severity+"</div>").join("")+"</div><div class='p'><h3>NetOps</h3>"+(x.netops_jobs||[]).map(z=>"<div>"+z.device+" — "+z.status+"</div>").join("")+"</div><div class='p'><h3>Compliance</h3>"+(x.compliance||[]).map(z=>"<div>"+z.device+" — "+z.policy+" — "+z.status+"</div>").join("")+"</div><div class='p'><h3>Topology</h3>"+(x.neighbors||[]).map(z=>"<div>"+z.local_device+" → "+(z.neighbor||z.ip||"unknown")+"</div>").join("")+"</div><div class='p'><h3>Config Templates</h3>"+(x.templates||[]).map(z=>"<div>"+z.name+" — "+z.vendor+"</div>").join("")+"</div>"};boot()</script></body></html>
