<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Network Inventory</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial;background:#eef2f7;color:#0f172a}header{background:#0f172a;color:#fff;padding:18px}.w{max-width:1250px;margin:auto;padding:18px}.p{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:16px;margin-bottom:14px}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #e2e8f0;text-align:right;font-size:13px}input,select,button{font:inherit;padding:8px;border:1px solid #cbd5e1;border-radius:7px}button{background:#0f172a;color:#fff;cursor:pointer}.ok{color:#166534}.bad{color:#991b1b}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}</style></head><body>
<header><a href="/" style="color:#fff">← اصلی</a>　<b>Network Device Inventory</b></header><main class="w"><div class="p"><h2>افزودن دستی Device</h2><div class="row"><input id="an" placeholder="Name"><input id="ah" placeholder="IP / Host"><input id="at" placeholder="device_type" value="cisco_ios"><input id="as" placeholder="Site" value="HQ"><input id="ar" placeholder="Role" value="network"><button onclick="addDevice()">Add Device</button></div></div><div class="p row"><button onclick="load()">Refresh</button><button onclick="testAll()">Test همه</button><span id="msg"></span></div><div class="p"><table><thead><tr><th>Status</th><th>Name</th><th>Host</th><th>Type</th><th>Site</th><th>Role</th><th>Enabled</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div></main>
<script>
let CSRF="";
async function api(u,o={}){if(o.method&&o.method!=="GET")o.headers={...(o.headers||{}),"Content-Type":"application/json","X-CSRF-Token":CSRF};let r=await fetch(u,o);if(r.status===401){location="/archive";throw 0}if(!r.ok)throw Error(await r.text());return r.json()}
function esc(v){return String(v??"").replace(/[&<>"]/g,s=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[s]))}
async function load(){let x=await api("/api/netops/devices");rows.innerHTML=x.map(d=>"<tr><td class='"+(d.connection_ok===true?"ok":d.connection_ok===false?"bad":"")+"'><b>"+(d.connection_ok===true?"Connected":d.connection_ok===false?"Failed":"Unknown")+"</b><br><small>"+(d.last_test||"—")+"</small></td><td><input id='n-"+d.id+"' value='"+esc(d.name)+"'></td><td><input id='h-"+d.id+"' value='"+esc(d.host)+"'></td><td><input id='t-"+d.id+"' value='"+esc(d.device_type)+"'></td><td><input id='s-"+d.id+"' value='"+esc(d.site)+"'></td><td><input id='r-"+d.id+"' value='"+esc(d.role)+"'></td><td><input id='e-"+d.id+"' type='checkbox' "+(d.enabled?"checked":"")+"></td><td><button onclick=\"save('"+d.id+"')\">Save</button></td></tr>").join("")}
async function addDevice(){try{await api("/api/netops/devices",{method:"POST",body:JSON.stringify({name:an.value,host:ah.value,device_type:at.value||"cisco_ios",site:as.value||"HQ",role:ar.value||"network",port:22,enabled:true,save_after:true})});an.value="";ah.value="";msg.textContent="Device added. برای Credential در سرور setup-netops-credentials.sh را اجرا کن.";load()}catch(e){msg.textContent=e.message}}
async function delDevice(id){if(!confirm("Delete device from inventory?"))return;await api("/api/netops/devices/"+id,{method:"DELETE"});load()}
async function save(id){let body={name:document.getElementById("n-"+id).value,host:document.getElementById("h-"+id).value,device_type:document.getElementById("t-"+id).value,site:document.getElementById("s-"+id).value,role:document.getElementById("r-"+id).value,enabled:document.getElementById("e-"+id).checked};await api("/api/netops/devices/"+id,{method:"PATCH",body:JSON.stringify(body)});msg.textContent="Saved: "+id}
async function testAll(){msg.textContent="Testing...";let x=await api("/api/netops/devices/test-all",{method:"POST"});msg.textContent="Connected "+x.ok+" / "+x.total}
(async()=>{let m=await api("/api/auth/me");CSRF=m.csrf;if(!m.admin){document.body.innerHTML="Admin required";return}load()})()
</script></body></html>
