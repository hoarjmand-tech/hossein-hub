<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bulk Import</title><style>*{box-sizing:border-box}body{margin:0;font-family:Tahoma;background:#eef2f7;color:#0f172a}header{background:#0f172a;color:#fff;padding:18px}.w{max-width:950px;margin:auto;padding:18px}.p{background:#fff;padding:16px;border-radius:14px;margin-bottom:14px}button{padding:10px 14px;border:0;border-radius:8px;background:#0f172a;color:#fff}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #ddd;text-align:right}.muted{color:#64748b}</style></head><body><header><a href="/" style="color:#fff">← اصلی</a>　<b>Bulk Import اسناد</b></header><main class="w"><div class="p"><p>فایل‌ها را در پوشه <code>/opt/hossein-hub/archive/import</code> قرار بده. سیستم MIME و Duplicate را بررسی می‌کند.</p><button onclick="load()">بازخوانی صف</button> <button onclick="processQ()">پردازش همه</button><p id="msg" class="muted"></p></div><div class="p"><table><thead><tr><th>نام</th><th>حجم</th><th>MIME</th></tr></thead><tbody id="rows"></tbody></table></div></main><script>
let CSRF="";async function api(u,o={}){if(o.method&&o.method!=="GET")o.headers={...(o.headers||{}),"X-CSRF-Token":CSRF};let r=await fetch(u,o);if(r.status===401){location="/archive";throw 0}if(!r.ok)throw Error(await r.text());return r.json()}async function boot(){let m=await api("/api/auth/me");CSRF=m.csrf;load()}async function load(){let x=await api("/api/import/queue");rows.innerHTML=x.map(z=>`<tr><td>${z.name}</td><td>${(z.bytes/1048576).toFixed(2)} MB</td><td>${z.mime}</td></tr>`).join("");msg.textContent=x.length+" فایل در صف"}async function processQ(){let x=await api("/api/import/process",{method:"POST"});msg.textContent="Imported: "+x.imported.length+" | Duplicate: "+x.duplicates.length+" | Rejected: "+x.rejected.length;load()}boot();
</script></body></html>
