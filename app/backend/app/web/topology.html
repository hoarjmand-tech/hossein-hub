<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Network Topology</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial;background:#eef2f7;color:#0f172a}header{background:#0f172a;color:#fff;padding:18px}.w{max-width:1250px;margin:auto;padding:18px}.p{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:16px;margin-bottom:14px}button{font:inherit;padding:10px 14px;border:0;border-radius:8px;background:#0f172a;color:#fff;cursor:pointer}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #e2e8f0;text-align:right;font-size:13px}.nodes{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.node{padding:12px;border:1px solid #cbd5e1;border-radius:10px;background:#f8fafc}.managed{border-width:2px}.muted{color:#64748b}@media(max-width:900px){.nodes{grid-template-columns:1fr 1fr}}</style></head><body>
<header><a href="/" style="color:#fff">← اصلی</a>　<b>Network Topology</b></header><main class="w"><div class="p"><button onclick="collect()">Collect LLDP/CDP</button> <button onclick="load()">Refresh</button><span id="msg"></span></div><div class="p"><h2>Topology Map</h2><svg id="graphsvg" viewBox="0 0 1000 600" style="width:100%;height:600px;background:#f8fafc;border-radius:12px"></svg></div><div class="p"><h2>Nodes</h2><div id="nodes" class="nodes"></div></div><div class="p"><h2>Links</h2><table><thead><tr><th>Source</th><th>Local Port</th><th>Target</th><th>Remote Port</th><th>Protocol</th></tr></thead><tbody id="edges"></tbody></table></div></main>
<script>
let CSRF="",graph={};
async function api(u,o={}){if(o.method&&o.method!=="GET")o.headers={...(o.headers||{}),"X-CSRF-Token":CSRF};let r=await fetch(u,o);if(r.status===401){location="/archive";throw 0}if(!r.ok)throw Error(await r.text());return r.json()}
function label(id){let n=(graph.nodes||[]).find(x=>x.id===id);return n?n.label:id}
function drawGraph(){let svg=document.getElementById("graphsvg"),ns="http://www.w3.org/2000/svg";svg.innerHTML="";let arr=graph.nodes||[],n=Math.max(arr.length,1),cx=500,cy=300,rad=Math.min(240,70+n*9),pos={};arr.forEach((x,i)=>{let a=(Math.PI*2*i/n)-Math.PI/2;pos[x.id]={x:cx+rad*Math.cos(a),y:cy+rad*Math.sin(a)}});(graph.edges||[]).forEach(e=>{if(!pos[e.source]||!pos[e.target])return;let l=document.createElementNS(ns,"line");l.setAttribute("x1",pos[e.source].x);l.setAttribute("y1",pos[e.source].y);l.setAttribute("x2",pos[e.target].x);l.setAttribute("y2",pos[e.target].y);l.setAttribute("stroke","#94a3b8");l.setAttribute("stroke-width","2");svg.appendChild(l)});arr.forEach(x=>{let g=document.createElementNS(ns,"g"),c=document.createElementNS(ns,"circle"),t=document.createElementNS(ns,"text");c.setAttribute("cx",pos[x.id].x);c.setAttribute("cy",pos[x.id].y);c.setAttribute("r",x.managed?"28":"22");c.setAttribute("fill",x.managed?"#0f172a":"#cbd5e1");t.setAttribute("x",pos[x.id].x);t.setAttribute("y",pos[x.id].y+44);t.setAttribute("text-anchor","middle");t.setAttribute("font-size","12");t.textContent=x.label;g.appendChild(c);g.appendChild(t);svg.appendChild(g)})}
async function load(){graph=await api("/api/topology/graph");drawGraph();nodes.innerHTML=graph.nodes.map(n=>"<div class='node "+(n.managed?"managed":"")+"'><b>"+n.label+"</b><div class='muted'>"+(n.host||"—")+"</div><div>"+(n.type||"unknown")+"</div><div>"+(n.site||"")+"</div></div>").join("");edges.innerHTML=graph.edges.map(e=>"<tr><td>"+label(e.source)+"</td><td>"+(e.local_interface||"—")+"</td><td>"+label(e.target)+"</td><td>"+(e.neighbor_interface||"—")+"</td><td>"+e.protocol+"</td></tr>").join("");msg.textContent=graph.nodes.length+" nodes / "+graph.edges.length+" links"}
async function collect(){msg.textContent="Collecting...";try{let x=await api("/api/topology/collect",{method:"POST"});msg.textContent=x.neighbors+" neighbors found";load()}catch(e){msg.textContent=e.message}}
(async()=>{let m=await api("/api/auth/me");CSRF=m.csrf;if(!m.admin){document.body.innerHTML="Admin required";return}load()})()
</script></body></html>
