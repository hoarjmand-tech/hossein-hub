<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f172a"><link rel="manifest" href="/manifest.json"><title>Hossein Hub</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial;background:#f1f5f9;color:#0f172a}.top{background:#0f172a;color:#fff;padding:16px 24px;display:flex;justify-content:space-between;align-items:center}.wrap{max-width:1320px;margin:auto;padding:20px}.cards{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.card,.panel{background:white;border-radius:14px;padding:16px;box-shadow:0 1px 3px #0002}.num{font-size:26px;font-weight:700;margin-top:8px}.panel{margin-top:16px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}input,select,textarea,button{font:inherit;border:1px solid #cbd5e1;border-radius:9px;padding:10px}button{background:#0f172a;color:#fff;border:0;cursor:pointer}.red{background:#991b1b}.green{background:#166534}.muted{color:#64748b;font-size:12px}table{width:100%;border-collapse:collapse;margin-top:12px}td,th{padding:10px;border-bottom:1px solid #e2e8f0;text-align:right}.badge{background:#e2e8f0;padding:3px 7px;border-radius:12px;font-size:11px}dialog{border:0;border-radius:16px;width:min(760px,96vw);padding:22px}dialog::backdrop{background:#0009}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.full{grid-column:1/-1}.preview{max-width:100%;max-height:420px;border-radius:10px}.checks{display:flex;gap:8px;align-items:center}@media(max-width:850px){.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.wrap{padding:9px}table{font-size:12px}.hide-m{display:none}}</style></head><body>
<div id="authOverlay" style="position:fixed;inset:0;background:#0f172a;z-index:9999;display:flex;align-items:center;justify-content:center"><form id="authForm" style="background:#fff;padding:28px;border-radius:18px;width:min(420px,92vw)"><h2 id="authTitle">Hossein Hub</h2><p class="muted">ورود امن به آرشیو شخصی</p><input id="authUser" required minlength="3" autocomplete="username" placeholder="نام کاربری" style="width:100%;margin:6px 0"><input id="authPass" required minlength="12" type="password" autocomplete="current-password" placeholder="رمز عبور — حداقل ۱۲ کاراکتر" style="width:100%;margin:6px 0"><button style="width:100%;margin-top:8px">ادامه</button><p id="authMsg" class="muted"></p></form></div>
<header class="top"><div><b>Hossein Hub</b><div class="muted">Digital Archive v0.7.0</div></div><button onclick="openUpload()">+ سند جدید</button></header><main class="wrap"><div class="cards"><div class="card">اسناد<div id="nDocs" class="num">—</div></div><div class="card">افراد<div id="nPeople" class="num">—</div></div><div class="card">پرونده‌ها<div id="nCases" class="num">—</div></div><div class="card">یادآوری<div id="nRem" class="num">—</div></div><div class="card">سطل زباله<div id="nTrash" class="num">—</div></div><div class="card">حجم<div id="nSize" class="num">—</div></div></div>
<section class="panel"><div class="toolbar"><input id="q" placeholder="جستجو در عنوان، شماره، OCR، تگ..."><select id="cat"><option value="">همه دسته‌ها</option><option value="identity">هویتی</option><option value="residence">اقامت</option><option value="legal">حقوقی</option><option value="education">تحصیلی</option><option value="insurance">بیمه</option><option value="bank">بانکی</option><option value="company">شرکتی</option><option value="other">سایر</option></select><button onclick="load()">جستجو</button><button onclick="expiring()">انقضا ≤ ۹۰ روز</button><button class="green" onclick="exportSelected()">خروجی ZIP</button><button onclick="showReminders()">یادآوری‌ها</button><button onclick="showTrash()">سطل زباله</button></div><div id="stat" class="muted"></div><table><thead><tr><th>✓</th><th>عنوان</th><th>دسته</th><th class="hide-m">شماره</th><th>انقضا</th><th>عملیات</th></tr></thead><tbody id="rows"></tbody></table></section></main>
<dialog id="uploadDlg"><h3>ثبت سند</h3><form id="uploadForm" class="grid"><input class="full" name="title" required placeholder="عنوان"><select name="category"><option value="identity">هویتی</option><option value="residence">اقامت</option><option value="legal">حقوقی</option><option value="education">تحصیلی</option><option value="insurance">بیمه</option><option value="bank">بانکی</option><option value="company">شرکتی</option><option value="other">سایر</option></select><select name="kind"><option value="original">اصل</option><option value="translation">ترجمه</option><option value="signed">امضا/تأییدشده</option><option value="copy">کپی</option></select><input name="subtype" placeholder="نوع فرعی"><input name="document_number" placeholder="شماره سند"><input name="issuer" placeholder="صادرکننده"><input name="country" placeholder="کشور"><input name="tags" placeholder="تگ‌ها با کاما"><label>صدور <input name="issue_date" type="date"></label><label>انقضا <input name="expiry_date" type="date"></label><textarea class="full" name="notes" placeholder="یادداشت"></textarea><input class="full" name="file" type="file" accept=".pdf,image/*" required><div class="full"><button>ثبت + OCR</button> <button type="button" onclick="uploadDlg.close()">انصراف</button></div></form><p id="upmsg" class="muted"></p></dialog>
<dialog id="detailDlg"><div id="detailBox"></div><p><button onclick="detailDlg.close()">بستن</button></p></dialog>
<script>
let CSRF="";const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));
async function api(u,o={}){if(o.method&&o.method!=="GET")o.headers={...(o.headers||{}),"X-CSRF-Token":CSRF};let r=await fetch(u,o);if(r.status===401){showAuth(false);throw Error("login")}if(!r.ok)throw Error(await r.text());return r}
function showAuth(setup){$("authOverlay").style.display="flex";$("authOverlay").dataset.setup=setup?"1":"0";$("authTitle").textContent=setup?"راه‌اندازی اولیه Hossein Hub":"ورود به Hossein Hub"}
$("authForm").onsubmit=async e=>{e.preventDefault();let setup=$("authOverlay").dataset.setup==="1";let r=await fetch(setup?"/api/auth/setup":"/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:$("authUser").value,password:$("authPass").value})});if(!r.ok){$("authMsg").textContent=await r.text();return}let z=await r.json();CSRF=z.csrf;$("authOverlay").style.display="none";$("authPass").value="";dash();load()}
async function init(){try{let s=await(await fetch("/api/auth/status",{cache:"no-store"})).json();if(s.setup_required)return showAuth(true);let r=await fetch("/api/auth/me",{cache:"no-store"});if(r.ok){let me=await r.json();CSRF=me.csrf;$("authOverlay").style.display="none";dash();load()}else showAuth(false)}catch(e){$("authMsg").textContent="خطا در ارتباط با سرور"}}
async function dash(){let d=await(await api("/api/archive/dashboard")).json();$("nDocs").textContent=d.documents;$("nPeople").textContent=d.people;$("nCases").textContent=d.cases;$("nRem").textContent=d.reminders;$("nTrash").textContent=d.trash;$("nSize").textContent=(d.storage_bytes/1048576).toFixed(1)+" MB"}
function render(a){$("rows").innerHTML=a.map(x=>`<tr><td><input class="pick" type="checkbox" value="${x.id}"></td><td><b>${esc(x.title)}</b></td><td><span class="badge">${esc(x.category)}</span></td><td class="hide-m">${esc(x.document_number)}</td><td>${esc(x.expiry_date)}</td><td><button onclick="detail('${x.id}')">بازکردن</button> <button class="red" onclick="trashDoc('${x.id}')">حذف</button></td></tr>`).join("");$("stat").textContent=a.length+" سند"}
async function load(){let p=new URLSearchParams();if($("q").value)p.set("q",$("q").value);if($("cat").value)p.set("category",$("cat").value);render(await(await api("/api/archive/documents?"+p)).json())}
async function expiring(){render(await(await api("/api/archive/expiring?days=90")).json())}
async function showTrash(){render(await(await api("/api/archive/documents?deleted=true")).json())}
async function showReminders(){let a=await(await api("/api/archive/reminders")).json();$("detailBox").innerHTML="<h2>یادآوری‌ها</h2>"+(a.map(x=>"<div class='panel'><b>"+esc(x.remind_on)+"</b><p>"+esc(x.note)+"</p><button onclick=\"doneReminder('"+x.id+"')\">انجام شد</button></div>").join("")||"<p>یادآوری فعالی نیست.</p>");$("detailDlg").showModal()}
async function doneReminder(id){await api("/api/archive/reminders/"+id+"/done",{method:"POST"});showReminders();dash()}
async function makeShare(id){let f=new FormData();f.set("hours","24");f.set("max_downloads","1");let x=await(await api("/api/archive/documents/"+id+"/share",{method:"POST",body:f})).json();let u=location.origin+"/s/"+x.token;await navigator.clipboard.writeText(u);alert("لینک امن ۲۴ ساعته کپی شد: "+u)}
async function detail(id){let d=await(await api("/api/archive/documents/"+id)).json();$("detailBox").innerHTML=`<h2>${esc(d.title)}</h2><p>تگ‌ها: ${d.tags.map(esc).join("، ")||"—"}</p><p><button onclick="makeShare(\'${d.id}\')">لینک امن ۲۴ ساعته</button></p>`+d.versions.map(v=>`<div class="panel"><b>نسخه ${v.version} — ${esc(v.kind)}</b><p>${esc(v.name)} | OCR: ${esc(v.ocr_status)}</p><button onclick="downloadV('${v.id}','${esc(v.name)}')">دانلود</button><details><summary>متن OCR</summary><pre style="white-space:pre-wrap">${esc(v.ocr_text)}</pre></details></div>`).join("");$("detailDlg").showModal()}
async function downloadV(id,name){let r=await api("/api/archive/versions/"+id+"/download"),b=await r.blob(),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;a.click();URL.revokeObjectURL(a.href)}
async function trashDoc(id){if(confirm("به سطل زباله منتقل شود؟")){await api("/api/archive/documents/"+id,{method:"DELETE"});load();dash()}}
async function exportSelected(){let ids=[...document.querySelectorAll(".pick:checked")].map(x=>x.value);if(!ids.length)return alert("حداقل یک سند انتخاب کن");let r=await api("/api/archive/export?ids="+ids.join(",")),b=await r.blob(),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="hossein-hub-export.zip";a.click()}
function openUpload(){$("uploadDlg").showModal()}$("uploadForm").onsubmit=async e=>{e.preventDefault();$("upmsg").textContent="آپلود، OCR و Preview...";try{await api("/api/archive/documents",{method:"POST",body:new FormData($("uploadForm"))});$("uploadForm").reset();$("uploadDlg").close();load();dash()}catch(x){$("upmsg").textContent=x.message}}
init();if("serviceWorker"in navigator)navigator.serviceWorker.register("/sw.js",{updateViaCache:"none"});
</script></body></html>
