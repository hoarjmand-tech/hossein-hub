<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><link rel="manifest" href="/manifest.json"><title>Hossein Hub | Archive</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f3f4f6;color:#111827}.top{background:#111827;color:#fff;padding:18px 24px;display:flex;justify-content:space-between;align-items:center}.top h1{margin:0;font-size:21px}.wrap{max-width:1250px;margin:auto;padding:22px}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.card,.panel{background:#fff;border-radius:14px;padding:18px;box-shadow:0 1px 4px #0001}.n{font-size:27px;font-weight:bold;margin-top:8px}.panel{margin-top:18px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}input,select,button,textarea{font:inherit;padding:10px;border:1px solid #d1d5db;border-radius:9px}input,select{background:#fff}button{background:#111827;color:#fff;cursor:pointer;border:0}.danger{background:#991b1b}.muted{color:#6b7280;font-size:13px}table{width:100%;border-collapse:collapse;margin-top:14px}th,td{text-align:right;padding:11px;border-bottom:1px solid #eee}dialog{border:0;border-radius:15px;width:min(700px,94vw);padding:22px}dialog::backdrop{background:#0008}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}.badge{background:#e5e7eb;padding:4px 8px;border-radius:20px;font-size:12px}@media(max-width:800px){.cards{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}table{font-size:12px}.wrap{padding:10px}}
</style></head><body><div class="top"><h1>Hossein Hub — آرشیو اسناد</h1><button onclick="openUpload()">+ سند جدید</button></div><main class="wrap">
<div class="cards"><div class="card">اسناد<div id="docs" class="n">—</div></div><div class="card">افراد<div id="people" class="n">—</div></div><div class="card">پرونده‌ها<div id="cases" class="n">—</div></div><div class="card">سطل زباله<div id="trash" class="n">—</div></div><div class="card">فضای فایل‌ها<div id="size" class="n">—</div></div></div>
<section class="panel"><div class="toolbar"><input id="q" placeholder="جستجو: عنوان، شماره، صادرکننده..." oninput="loadDocs()"><select id="cat" onchange="loadDocs()"><option value="">همه دسته‌ها</option><option>identity</option><option>residence</option><option>legal</option><option>education</option><option>insurance</option><option>bank</option><option>company</option><option>other</option></select><button onclick="loadExpiring()">در حال انقضا</button><button onclick="loadDocs()">همه اسناد</button></div><div id="status" class="muted"></div><table><thead><tr><th>عنوان</th><th>دسته</th><th>شماره</th><th>انقضا</th><th>عملیات</th></tr></thead><tbody id="rows"></tbody></table></section>
</main>
<dialog id="dlg"><h3>ثبت سند جدید</h3><form id="up" class="grid"><input class="full" name="title" required placeholder="عنوان سند"><select name="category"><option value="identity">هویتی</option><option value="residence">اقامت</option><option value="legal">حقوقی</option><option value="education">تحصیلی</option><option value="insurance">بیمه</option><option value="bank">بانکی</option><option value="company">شرکتی</option><option value="other">سایر</option></select><input name="subtype" placeholder="نوع فرعی"><input name="document_number" placeholder="شماره سند"><input name="issuer" placeholder="صادرکننده"><input name="country" placeholder="کشور"><label>تاریخ صدور<input name="issue_date" type="date"></label><label>تاریخ انقضا<input name="expiry_date" type="date"></label><textarea class="full" name="notes" placeholder="یادداشت"></textarea><input class="full" name="file" type="file" required><div class="full"><button type="submit">آپلود و ثبت</button> <button type="button" onclick="dlg.close()">انصراف</button></div></form><div id="upmsg" class="muted"></div></dialog>
<script>
let KEY=localStorage.getItem("hubKey")||"";if(!KEY){KEY=prompt("Hossein Hub API Key")||"";localStorage.setItem("hubKey",KEY)}
const H=()=>({"X-API-Key":KEY});const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));
async function api(u,o={}){o.headers={...(o.headers||{}),...H()};let r=await fetch(u,o);if(r.status===401){localStorage.removeItem("hubKey");location.reload()}if(!r.ok)throw new Error(await r.text());return r}
async function dash(){let d=await (await api("/api/archive/dashboard")).json();docs.textContent=d.documents;people.textContent=d.people;cases.textContent=d.cases;trash.textContent=d.trash;size.textContent=(d.storage_bytes/1048576).toFixed(1)+" MB"}
function render(a){rows.innerHTML=a.map(x=>`<tr><td><b>${esc(x.title)}</b></td><td><span class=badge>${esc(x.category)}</span></td><td>${esc(x.document_number)}</td><td>${esc(x.expiry_date)}</td><td><button onclick="detail('${x.id}')">جزئیات</button> <button class=danger onclick="delDoc('${x.id}')">حذف</button></td></tr>`).join("");status.textContent=a.length+" مورد"}
async function loadDocs(){let p=new URLSearchParams();if(q.value)p.set("q",q.value);if(cat.value)p.set("category",cat.value);render(await (await api("/api/archive/documents?"+p)).json())}
async function loadExpiring(){render(await (await api("/api/archive/expiring?days=90")).json())}
async function delDoc(id){if(confirm("به سطل زباله منتقل شود؟")){await api("/api/archive/documents/"+id,{method:"DELETE"});await loadDocs();await dash()}}
async function detail(id){let d=await (await api("/api/archive/documents/"+id)).json();alert(d.title+"\nنسخه‌ها: "+d.versions.length+"\n"+d.versions.map(v=>"v"+v.version+" - "+v.name).join("\n"))}
function openUpload(){dlg.showModal()}up.onsubmit=async e=>{e.preventDefault();upmsg.textContent="در حال آپلود...";try{await api("/api/archive/documents",{method:"POST",body:new FormData(up)});up.reset();dlg.close();await loadDocs();await dash()}catch(x){upmsg.textContent=x.message}}
dash();loadDocs();if("serviceWorker"in navigator)navigator.serviceWorker.register("/sw.js");
</script></body></html>
