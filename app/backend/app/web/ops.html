<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ops Assistant</title><style>body{margin:0;font-family:Tahoma;background:#eef2f7;color:#0f172a}header{background:#0f172a;color:#fff;padding:18px}.w{max-width:900px;margin:auto;padding:18px}.p{background:#fff;padding:16px;border-radius:14px;margin:12px 0}.row{display:flex;gap:8px}input,button{font:inherit;padding:11px;border-radius:9px;border:1px solid #cbd5e1}input{flex:1}button{background:#0f172a;color:#fff}pre{white-space:pre-wrap}</style></head><body><header><a href="/" style="color:#fff">← اصلی</a>　<b>Operational Assistant</b></header><main class="w"><div class="p"><div class="row"><input id="q" placeholder="مثلاً وضعیت FortiGate یا چه تجهیزاتی Down هستند؟"><button onclick="ask()">اجرا</button></div></div><div id="out" class="p">آماده است.</div></main><script>
let CSRF="";async function api(u,o={}){o.headers={...(o.headers||{}),"Content-Type":"application/json",...(CSRF?{"X-CSRF-Token":CSRF}:{})};let r=await fetch(u,o);if(r.status===401){location="/archive";throw 0}if(!r.ok)throw Error(await r.text());return r.json()}async function ask(){let x=await api("/api/ops-assistant/ask",{method:"POST",body:JSON.stringify({query:q.value})});out.innerHTML="<pre>"+JSON.stringify(x,null,2)+"</pre>"};(async()=>{let r=await fetch("/api/auth/me");if(!r.ok){location="/archive";return}CSRF=(await r.json()).csrf})()
</script></body></html>
