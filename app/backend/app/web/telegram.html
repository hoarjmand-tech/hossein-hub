<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><script src="https://telegram.org/js/telegram-web-app.js?63"></script><title>Hossein Hub</title><style>
*{box-sizing:border-box}body{margin:0;padding:calc(16px + var(--tg-content-safe-area-inset-top,0px)) 14px calc(24px + var(--tg-content-safe-area-inset-bottom,0px));font-family:Tahoma,Arial;background:var(--tg-theme-bg-color,#f3f4f6);color:var(--tg-theme-text-color,#111827)}h1{font-size:22px}.sub{color:var(--tg-theme-hint-color,#64748b)}.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card,.doc{background:var(--tg-theme-secondary-bg-color,#fff);padding:16px;border-radius:16px;margin:10px 0}.n{font-size:26px;font-weight:bold}.btn{display:block;text-decoration:none;text-align:center;background:var(--tg-theme-button-color,#2481cc);color:var(--tg-theme-button-text-color,#fff);padding:13px;border-radius:12px;margin:14px 0}.badge{font-size:11px;opacity:.7}</style></head><body>
<h1>Hossein Hub</h1><div id="who" class="sub">در حال احراز هویت…</div><div class="cards"><div class="card">اسناد<div id="docs" class="n">—</div></div><div class="card">یادآوری‌ها<div id="rem" class="n">—</div></div></div><a class="btn" href="/archive">باز کردن آرشیو کامل</a><h3>آخرین اسناد</h3><div id="list"></div>
<script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();const init=tg?.initData||"";
async function post(path){let r=await fetch("/api/telegram/"+path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({init_data:init})});if(!r.ok)throw Error(await r.text());return r.json()}
(async()=>{try{if(!init)throw Error("این صفحه را از داخل بات تلگرام باز کن.");let a=await post("login");document.getElementById("who").textContent="سلام "+(a.user.first_name||a.user.username||"");let d=await post("dashboard");docs.textContent=d.documents;rem.textContent=d.reminders;let x=await post("documents");list.innerHTML=x.map(v=>"<div class='doc'><b>"+String(v.title).replace(/[&<>]/g,"")+"</b><div class='badge'>"+v.category+(v.expiry_date?" · "+v.expiry_date:"")+"</div></div>").join("")||"<div class='sub'>سندی ثبت نشده است.</div>"}catch(e){who.textContent=e.message}})();
</script></body></html>
