<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مدیریت کاربران</title><style>*{box-sizing:border-box}body{margin:0;font-family:Tahoma;background:#eef2f7;color:#0f172a}header{background:#0f172a;color:#fff;padding:18px}.w{max-width:1000px;margin:auto;padding:18px}.p{background:#fff;padding:16px;border-radius:14px;margin-bottom:14px}input,button,label{font:inherit}input,button{padding:10px;border-radius:8px;border:1px solid #cbd5e1}button{background:#0f172a;color:white}.row{display:flex;gap:8px;flex-wrap:wrap}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #ddd;text-align:right}</style></head><body><header><a href="/" style="color:white">← اصلی</a>　<b>مدیریت کاربران و دسترسی</b></header><main class="w"><div class="p"><h3>کاربر جدید</h3><div class="row"><input id="u" placeholder="نام کاربری"><input id="p" type="password" placeholder="رمز حداقل ۱۲ کاراکتر"><label><input id="a" type="checkbox"> مدیر</label><button onclick="add()">ایجاد</button></div></div><div class="p"><table><thead><tr><th>کاربر</th><th>مدیر</th><th>فعال</th><th>آخرین ورود</th><th>عملیات</th></tr></thead><tbody id="rows"></tbody></table></div></main><script>
let CSRF="";async function api(x,o={}){if(o.method&&o.method!=="GET")o.headers={...(o.headers||{}),"Content-Type":"application/json","X-CSRF-Token":CSRF};let r=await fetch(x,o);if(r.status==401){location="/archive";throw 0}if(!r.ok)throw Error(await r.text());return r.json()}async function boot(){let m=await api("/api/auth/me");CSRF=m.csrf;load()}async function load(){let x=await api("/api/admin/users");rows.innerHTML=x.map(z=>`<tr><td>${z.username}</td><td>${z.is_admin?"بله":"خیر"}</td><td>${z.active?"فعال":"غیرفعال"}</td><td>${z.last_login||"—"}</td><td><button onclick="toggle(\'${z.id}\',${!z.active})">${z.active?"غیرفعال":"فعال"}</button> <button onclick="resetPwd(\'${z.id}\',\'${z.username}\')">رمز جدید</button></td></tr>`).join("")}async function add(){await api("/api/admin/users",{method:"POST",body:JSON.stringify({username:u.value,password:p.value,is_admin:a.checked})});p.value="";load()}async function toggle(id,v){try{await api("/api/admin/users/"+id,{method:"PATCH",body:JSON.stringify({active:v})});load()}catch(e){alert(e.message)}}
async function resetPwd(id,name){let p=prompt("رمز جدید برای "+name+" (حداقل ۱۲ کاراکتر)");if(!p)return;try{await api("/api/admin/users/"+id+"/password-reset",{method:"POST",body:JSON.stringify({password:p})});alert("رمز تغییر کرد و Sessionهای کاربر باطل شدند.")}catch(e){alert(e.message)}}boot();
</script></body></html>
