<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تنظیمات و وضعیت</title><style>*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial;background:#eef2f7;color:#0f172a}header{background:#0f172a;color:#fff;padding:18px}.w{max-width:1100px;margin:auto;padding:18px}.p{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:16px;margin:12px 0}.row{display:flex;gap:8px;flex-wrap:wrap}input,button{font:inherit;padding:10px;border-radius:9px;border:1px solid #cbd5e1}button{background:#0f172a;color:#fff;cursor:pointer}.muted{color:#64748b}.bad{color:#991b1b}.ok{color:#166534}a{color:inherit}</style></head><body><header><a href="/" style="color:white">← صفحه اصلی</a>　<b>تنظیمات و وضعیت</b></header><main class="w"><div id="sys" class="p"></div><div class="p"><h2>تغییر رمز عبور</h2><div class="row"><input id="oldp" type="password" placeholder="رمز فعلی"><input id="newp" type="password" placeholder="رمز جدید حداقل ۱۲ کاراکتر"><button onclick="change()">تغییر رمز</button></div><p id="msg"></p></div></main><script>let CSRF="";async function api(u,o={}){if(o.method&&o.method!=="GET")o.headers={...(o.headers||{}),"X-CSRF-Token":CSRF};let r=await fetch(u,o);if(r.status===401){location="/archive";throw 0}if(!r.ok)throw Error(await r.text());return r}async function boot(){let r=await fetch("/api/auth/me");if(!r.ok){location="/archive";return}CSRF=(await r.json()).csrf;await run()}async function run(){let x=await(await api("/api/system/status")).json();sys.innerHTML="<h2>وضعیت سیستم</h2><p><b>نسخه:</b> "+x.version+"</p><p><b>Database:</b> "+x.database+"</p><p><b>Hostname:</b> "+x.hostname+"</p><p><b>فضای آزاد:</b> "+(x.disk.free/1073741824).toFixed(1)+" GB</p>"} async function change(){let r=await api("/api/auth/password",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({current_password:oldp.value,new_password:newp.value})});msg.textContent=r.ok?"رمز عبور تغییر کرد.":"خطا"};boot()</script></body></html>
