<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ESXi Dashboard</title><style>*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial;background:#eef2f7;color:#0f172a}header{background:#0f172a;color:#fff;padding:18px}.w{max-width:1200px;margin:auto;padding:18px}.p{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:16px;margin:12px 0}.ok{color:#166534}.bad{color:#991b1b}.muted{color:#64748b}button{padding:9px 12px;border:0;border-radius:8px;background:#0f172a;color:#fff;margin:3px;cursor:pointer}pre{white-space:pre-wrap;max-height:520px;overflow:auto;background:#f8fafc;padding:12px;border-radius:8px}</style></head><body><header><a href="/connectors" style="color:#fff">← Connectors</a>　<b>ESXi / vCenter Dashboard</b></header><main class="w"><div class="p"><button onclick="load()">Inventory</button><div id="state"></div></div><div class="p"><pre id="out">آماده</pre></div></main><script>
let CSRF="";async function api(u){let r=await fetch(u,{headers:CSRF?{"X-CSRF-Token":CSRF}:{}});if(r.status===401){location="/archive";throw 0}if(!r.ok)throw Error(await r.text());return r.json()}
async function load(){let x=await api("/api/connectors/esxi/inventory");state.innerHTML=x.ok?"<span class='ok'>● متصل</span>":"<span class='bad'>● "+(x.error||"خطا")+"</span>";out.textContent=JSON.stringify(x.data||x,null,2)}
(async()=>{let r=await fetch("/api/auth/me");if(!r.ok){location="/archive";return}CSRF=(await r.json()).csrf;load()})()
</script></body></html>
