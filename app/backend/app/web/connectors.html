<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connectors</title><style>*{box-sizing:border-box}body{margin:0;font-family:Tahoma;background:#eef2f7;color:#0f172a}header{background:#0f172a;color:#fff;padding:18px}.w{max-width:1000px;margin:auto;padding:18px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.c{background:white;padding:18px;border-radius:14px}.ok{color:#166534}.bad{color:#991b1b}.muted{color:#64748b}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body><header><a href="/" style="color:white">← اصلی</a>　<b>Infrastructure Connectors</b></header><main class="w"><div class="grid"><div class="c"><h2>FortiGate</h2><div id="f">—</div></div><div class="c"><h2>ESXi / vCenter</h2><div id="e">—</div></div><div class="c"><h2>Veeam</h2><div id="v">—</div></div></div><div class="c" style="margin-top:14px"><p class="muted">Credentialها فقط از Secretهای محلی سرور خوانده می‌شوند و داخل GitHub ذخیره نمی‌شوند.</p></div></main><script>
let CSRF="";async function api(u){let r=await fetch(u,{headers:CSRF?{"X-CSRF-Token":CSRF}:{}});if(r.status===401){location="/archive";throw 0}if(!r.ok)throw Error(await r.text());return r.json()}function render(id,x){let el=document.getElementById(id);if(!x.configured)el.innerHTML="<span class='muted'>تنظیم نشده</span>";else if(x.ok)el.innerHTML="<span class='ok'>متصل</span><pre style='white-space:pre-wrap;max-height:280px;overflow:auto'>"+JSON.stringify(x.data,null,2)+"</pre>";else el.innerHTML="<span class='bad'>خطا</span><p>"+(x.error||"")+"</p>"};(async()=>{let m=await fetch("/api/auth/me");if(!m.ok){location="/archive";return}CSRF=(await m.json()).csrf;let x=await api("/api/connectors");render("f",x.fortigate);render("e",x.esxi);render("v",x.veeam)})()
</script></body></html>
