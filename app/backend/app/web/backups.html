<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Backup & Recovery</title><style>*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial;background:#eef2f7;color:#0f172a}header{background:#0f172a;color:#fff;padding:18px}.w{max-width:1100px;margin:auto;padding:18px}.p{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:16px;margin:12px 0}.row{display:flex;gap:8px;flex-wrap:wrap}input,button{font:inherit;padding:10px;border-radius:9px;border:1px solid #cbd5e1}button{background:#0f172a;color:#fff;cursor:pointer}.muted{color:#64748b}.bad{color:#991b1b}.ok{color:#166534}a{color:inherit}</style></head><body><header><a href="/" style="color:white">← صفحه اصلی</a>　<b>Backup & Recovery</b></header><main class="w"><div class="p"><h2>نسخه‌های پشتیبان</h2><p class="muted">Backupها به‌صورت رمزگذاری‌شده نگهداری می‌شوند.</p><div id="out"></div></div></main><script>let CSRF="";async function api(u,o={}){if(o.method&&o.method!=="GET")o.headers={...(o.headers||{}),"X-CSRF-Token":CSRF};let r=await fetch(u,o);if(r.status===401){location="/archive";throw 0}if(!r.ok)throw Error(await r.text());return r}async function boot(){let r=await fetch("/api/auth/me");if(!r.ok){location="/archive";return}CSRF=(await r.json()).csrf;await run()}async function run(){let x=await(await api("/api/system/backups")).json();out.innerHTML=x.length?x.map(z=>"<div class='p'><b>"+z.name+"</b> — "+(z.bytes/1048576).toFixed(1)+" MB — "+(z.encrypted?"<span class='ok'>Encrypted</span>":"<span class='bad'>Unencrypted</span>")+" <button onclick=\"verifyBackup('"+z.name+"')\">Verify</button><span id='v-"+z.name+"'></span></div>").join(""):"هنوز Backup ثبت نشده است."}async function verifyBackup(name){let el=document.getElementById("v-"+name);el.textContent=" checking...";try{let x=await(await api("/api/system/backups/"+encodeURIComponent(name)+"/verify")).json();el.innerHTML=x.ok?" <span class='ok'>Integrity OK</span>":" <span class='bad'>Integrity FAILED</span>"}catch(e){el.textContent=" error"}};boot()</script></body></html>
