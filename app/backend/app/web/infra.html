<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Infrastructure Analytics</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial;background:#eef2f7;color:#0f172a}header{background:#0f172a;color:#fff;padding:18px}.w{max-width:1250px;margin:auto;padding:18px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.p{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:16px;margin-bottom:14px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.s{background:#f8fafc;border-radius:10px;padding:12px}.n{font-size:24px;font-weight:700}.bad{color:#991b1b}.ok{color:#166534}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #e2e8f0;text-align:right;font-size:13px}.muted{color:#64748b}@media(max-width:900px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}}</style></head><body>
<header><a href="/" style="color:white">← اصلی</a>　<b>Infrastructure Analytics</b></header><main class="w">
<div class="p"><h2>Uptime 24h</h2><div id="uptimeGrid" class="stats"></div><div id="timeline" style="display:grid;gap:8px;margin-top:12px"></div></div><div class="grid">
<section class="p"><h2>FortiGate</h2><div class="stats"><div class="s">Sessions<div id="fgs" class="n">—</div></div><div class="s">Top Users<div id="fgu" class="n">—</div></div><div class="s">Top Sources<div id="fgsrc" class="n">—</div></div><div class="s">Apps<div id="fga" class="n">—</div></div></div><h3>Top Sources</h3><table><tbody id="fgrows"></tbody></table></section>
<section class="p"><h2>ESXi / vCenter</h2><div class="stats"><div class="s">Hosts<div id="vhosts" class="n">—</div></div><div class="s">VMs<div id="vvms" class="n">—</div></div><div class="s">VM On<div id="von" class="n">—</div></div><div class="s">Datastores<div id="vds" class="n">—</div></div></div><h3>VMs</h3><table><tbody id="vmrows"></tbody></table></section>
<section class="p"><h2>Veeam</h2><div class="stats"><div class="s">Jobs<div id="jobs" class="n">—</div></div><div class="s">Running<div id="running" class="n">—</div></div><div class="s">Success<div id="succ" class="n ok">—</div></div><div class="s">Failed<div id="fail" class="n bad">—</div></div></div><h3>Failed Sessions</h3><table><tbody id="vr"></tbody></table></section>
</div></main><script>
let CSRF="";async function api(u){let r=await fetch(u,{headers:CSRF?{"X-CSRF-Token":CSRF}:{}});if(r.status===401){location="/archive";throw 0}if(!r.ok)throw Error(await r.text());return r.json()}
function esc(x){return String(x??"").replace(/[&<>]/g,"")}
function line(name,points){let bars=points.map(p=>"<span title='"+esc(p.at)+"' style='display:block;flex:1;height:14px;border-radius:3px;background:"+(p.status==="up"?"#16a34a":p.status==="down"?"#dc2626":"#94a3b8")+"'></span>").join("");return "<div><b>"+esc(name)+"</b><div style='display:flex;gap:2px;margin-top:5px'>"+bars+"</div></div>"}
async function history(){let s=await api("/api/infra-history/summary?hours=24");uptimeGrid.innerHTML=Object.entries(s).map(([k,v])=>"<div class='s'>"+esc(k)+"<div class='n'>"+(v.uptime_pct==null?"—":v.uptime_pct+"%")+"</div><div class='"+(v.last_status==="up"?"ok":"bad")+"'>"+esc(v.last_status)+"</div></div>").join("");let all=[];for(let k of ["FortiGate","ESXi/vCenter","Veeam"]){let p=await api("/api/infra-history/"+encodeURIComponent(k)+"?hours=24&limit=96");all.push(line(k,p))}timeline.innerHTML=all.join("")}
async function load(){let f=await api("/api/infra-analytics/fortigate/top");fgs.textContent=f.total_sessions??"—";fgu.textContent=f.top_users?.length??0;fgsrc.textContent=f.top_sources?.length??0;fga.textContent=f.top_apps?.length??0;fgrows.innerHTML=(f.top_sources||[]).map(x=>"<tr><td>"+esc(x.name)+"</td><td>"+x.sessions+" session</td><td>"+((x.bytes||0)/1048576).toFixed(1)+" MB</td></tr>").join("");
let v=await api("/api/infra-analytics/vmware/summary");vhosts.textContent=v.hosts??"—";vvms.textContent=v.vms??"—";von.textContent=v.vms_on??"—";vds.textContent=v.datastores??"—";vmrows.innerHTML=(v.vm_items||[]).slice(0,20).map(x=>"<tr><td>"+esc(x.name)+"</td><td>"+esc(x.power)+"</td><td>"+(x.cpu??"—")+" CPU</td><td>"+(x.memory_mb??"—")+" MB</td></tr>").join("");
let z=await api("/api/infra-analytics/veeam/summary");jobs.textContent=z.jobs??"—";running.textContent=z.running??"—";succ.textContent=z.successful??"—";fail.textContent=z.failed??"—";vr.innerHTML=(z.failed_items||[]).map(x=>"<tr><td>"+esc(x.name||x.jobName||x.id||"Session")+"</td><td>"+esc(x.state||x.result||x.status||"failed")+"</td></tr>").join("")}
(async()=>{let r=await fetch("/api/auth/me");if(!r.ok){location="/archive";return}CSRF=(await r.json()).csrf;load();history();setInterval(load,60000);setInterval(history,300000)})()
</script></body></html>
