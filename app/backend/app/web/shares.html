<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>اشتراک‌های امن</title><style>*{box-sizing:border-box}body{margin:0;font-family:Tahoma;background:#eef2f7;color:#0f172a}header{background:#0f172a;color:#fff;padding:18px}.w{max-width:1050px;margin:auto;padding:18px}.p{background:#fff;padding:16px;border-radius:14px;margin:12px 0;border:1px solid #e2e8f0}button{padding:9px 12px;border:0;border-radius:8px;background:#0f172a;color:#fff}.bad{color:#991b1b}.ok{color:#166534}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #e2e8f0;text-align:right}</style></head><body><header><a href="/" style="color:#fff">← اصلی</a>　<b>اشتراک‌های امن اسناد</b></header><main class="w"><div class="p"><table><thead><tr><th>Document</th><th>Downloads</th><th>Expires</th><th>Status</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></main><script>
let CSRF="";async function api(u,o={}){if(o.method&&o.method!=="GET")o.headers={...(o.headers||{}),"X-CSRF-Token":CSRF};let r=await fetch(u,o);if(r.status===401){location="/archive";throw 0}if(!r.ok)throw Error(await r.text());return r.json()}
async function load(){let x=await api("/api/archive/shares");rows.innerHTML=x.map(z=>"<tr><td>"+z.document_id+"</td><td>"+z.downloads+" / "+z.max_downloads+"</td><td>"+z.expires_at+"</td><td class='"+(z.active?"ok":"bad")+"'>"+(z.active?"Active":"Revoked")+"</td><td>"+(z.active?"<button onclick=\"revoke('"+z.id+"')\">Revoke</button>":"")+"</td></tr>").join("")}
async function revoke(id){await api("/api/archive/shares/"+id,{method:"DELETE"});load()}
(async()=>{let m=await api("/api/auth/me");CSRF=m.csrf;load()})()
</script></body></html>
