<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IT Control Center</title><style>*{box-sizing:border-box}body{margin:0;font-family:Tahoma;background:#eef2f7;color:#0f172a}header{background:#0f172a;color:white;padding:18px}.w{max-width:1200px;margin:auto;padding:18px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.c,.p{background:white;padding:16px;border-radius:14px;margin-bottom:14px}.n{font-size:28px;font-weight:bold}input,select,button{padding:10px;border:1px solid #cbd5e1;border-radius:8px}button{background:#0f172a;color:white}.row{display:flex;gap:8px;flex-wrap:wrap}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #ddd;text-align:right}.up{color:#166534}.down{color:#991b1b}@media(max-width:700px){.cards{grid-template-columns:1fr 1fr}}</style></head><body><header><a href="/" style="color:white">← اصلی</a>　<b>IT Control Center</b></header><main class="w"><div class="cards"><div class="c">دارایی‌ها<div id="a" class="n">—</div></div><div class="c">UP<div id="u" class="n">—</div></div><div class="c">DOWN<div id="d" class="n">—</div></div><div class="c">هشدار<div id="al" class="n">—</div></div></div><div class="p"><h3>افزودن تجهیز / سرویس</h3><div class="row"><input id="name" placeholder="نام"><select id="kind"><option>server</option><option>firewall</option><option>switch</option><option>esxi</option><option>service</option></select><input id="addr" placeholder="IP / Host"><input id="port" type="number" placeholder="Port"><select id="proto"><option>tcp</option><option>http</option><option>https</option></select><button onclick="add()">ثبت</button><button onclick="checkAll()">Check All</button></div></div><div class="p"><table><thead><tr><th>نام</th><th>نوع</th><th>آدرس</th><th>وضعیت</th><th>Latency</th><th></th></tr></thead><tbody id="rows"></tbody></table></div><div class="p"><h3>تاریخچه مانیتورینگ</h3><div id="historyBox" class="muted">برای مشاهده تاریخچه روی دکمه تاریخچه هر تجهیز بزن.</div></div></main><script>
let csrf="";async function api(p,o={}){o.headers={...(o.headers||{}),"Content-Type":"application/json",...(csrf?{"X-CSRF-Token":csrf}:{})};let r=await fetch(p,o);if(r.status==401){location="/archive";throw 0}if(!r.ok)throw Error(await r.text());return r.json()}async function init(){let m=await api("/api/auth/me");csrf=m.csrf;load()}async function load(){let x=await api("/api/it/dashboard");a.textContent=x.assets;u.textContent=x.up;d.textContent=x.down;al.textContent=x.alerts;let z=await api("/api/it/assets");rows.innerHTML=z.map(x=>`<tr><td>${x.name}</td><td>${x.kind}</td><td>${x.address}:${x.port||""}</td><td class="${x.status}">${x.status}</td><td>${x.latency_ms??"—"}</td><td><button onclick="check('${x.id}')">تست</button></td></tr>`).join("")}async function add(){await api("/api/it/assets",{method:"POST",body:JSON.stringify({name:name.value,kind:kind.value,address:addr.value,port:port.value?+port.value:null,protocol:proto.value})});load()}async function check(id){await api("/api/it/assets/"+id+"/check",{method:"POST"});load()}async function checkAll(){await api("/api/it/check-all",{method:"POST"});load()}async function history(id){let x=await api("/api/it-history/"+id+"?limit=50");historyBox.innerHTML="<b>"+x.asset.name+"</b><br>"+x.checks.map(z=>(z.checked_at+" — "+z.status+" — "+(z.latency_ms??"—")+" ms")).join("<br>")}init();
</script></body></html>
