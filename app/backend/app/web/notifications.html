<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>اعلان‌ها</title><style>*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial;background:#eef2f7;color:#0f172a}header{background:#0f172a;color:#fff;padding:18px}.w{max-width:1100px;margin:auto;padding:18px}.p{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:16px;margin:12px 0}.row{display:flex;gap:8px;flex-wrap:wrap}input,button{font:inherit;padding:10px;border-radius:9px;border:1px solid #cbd5e1}button{background:#0f172a;color:#fff;cursor:pointer}.muted{color:#64748b}.bad{color:#991b1b}.ok{color:#166534}a{color:inherit}</style></head><body><header><a href="/" style="color:white">← صفحه اصلی</a>　<b>اعلان‌ها</b></header><main class="w"><div class="p row"><button onclick="readAll()">خواندن همه اعلان‌ها</button><button onclick="ackAll()">تأیید همه هشدارهای IT</button></div><div id="out"></div></main><script>let CSRF="";async function api(u,o={}){if(o.method&&o.method!=="GET")o.headers={...(o.headers||{}),"X-CSRF-Token":CSRF};let r=await fetch(u,o);if(r.status===401){location="/archive";throw 0}if(!r.ok)throw Error(await r.text());return r}async function boot(){let r=await fetch("/api/auth/me");if(!r.ok){location="/archive";return}CSRF=(await r.json()).csrf;await run()}async function readAll(){await api("/api/manage/notifications/read-all",{method:"POST"});run()}
async function ackAll(){await api("/api/it/alerts/ack-all",{method:"POST"});run()}
async function run(){let docs=await(await api("/api/manage/notifications")).json();let alerts=await(await api("/api/it/alerts")).json();out.innerHTML="<div class='p'><h2>اعلان‌های اسناد</h2>"+(docs.map(x=>"<div><b>"+x.title+"</b><p>"+(x.body||"")+"</p></div>").join("")||"موردی نیست")+"</div><div class='p'><h2>هشدارهای IT</h2>"+(alerts.map(x=>"<div class='"+(x.acknowledged?"":"bad")+"'><b>"+x.title+"</b><p>"+(x.body||"")+"</p></div>").join("")||"موردی نیست")+"</div>"};boot()</script></body></html>
