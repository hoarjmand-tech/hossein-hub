<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NetOps Library</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial;background:#eef2f7;color:#0f172a}header{background:#0f172a;color:#fff;padding:18px}.w{max-width:1250px;margin:auto;padding:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.p{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:16px;margin-bottom:14px}input,select,textarea,button{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;margin:5px 0;font:inherit}textarea{min-height:110px;direction:ltr;text-align:left;font-family:monospace}button{background:#0f172a;color:#fff;cursor:pointer}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.ok{color:#166534}.bad{color:#991b1b}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #e2e8f0;text-align:right;font-size:13px}@media(max-width:900px){.grid,.row{grid-template-columns:1fr}}</style></head><body>
<header><a href="/" style="color:#fff">← اصلی</a>　<b>NetOps Config Library & Change Policies</b></header><main class="w">
<div class="grid"><section class="p"><h2>Template جدید</h2><div class="row"><input id="tname" placeholder="نام Template"><input id="vendor" placeholder="Vendor: cisco_ios / fortinet / ..."></div><div class="row"><input id="role" placeholder="Role: switch / firewall"><input id="vars" placeholder="Variables: vlan_id,vlan_name"></div><input id="desc" placeholder="توضیح"><label>Pre-check</label><textarea id="tpre"></textarea><label>Change</label><textarea id="tchg"></textarea><label>Post-check</label><textarea id="tpost"></textarea><label>Rollback</label><textarea id="trb"></textarea><button onclick="addTemplate()">ذخیره Template</button><div id="tmsg"></div></section>
<section class="p"><h2>Templateها</h2><table><thead><tr><th>نام</th><th>Vendor</th><th>Role</th><th></th></tr></thead><tbody id="templates"></tbody></table><h3>Render Template</h3><select id="tsel"></select><textarea id="values" placeholder='{"vlan_id":"120","vlan_name":"VOICE"}'></textarea><button onclick="renderTemplate()">Render</button><pre id="rendered"></pre></section></div>
<div class="grid"><section class="p"><h2>Change Policy جدید</h2><input id="pname" placeholder="نام Policy"><label><input id="reqpre" type="checkbox" style="width:auto"> Pre-check اجباری</label><label><input id="reqpost" type="checkbox" style="width:auto"> Post-check اجباری</label><label><input id="reqrb" type="checkbox" style="width:auto"> Rollback اجباری</label><input id="blocked" placeholder="Blocked patterns با کاما"><button onclick="addPolicy()">ایجاد Policy</button></section>
<section class="p"><h2>Policyها</h2><table><thead><tr><th>نام</th><th>Pre</th><th>Post</th><th>Rollback</th><th>Blocked</th><th></th></tr></thead><tbody id="policies"></tbody></table></section></div></main>
<script>
let CSRF="";
async function api(u,o={}){if(o.method&&o.method!=="GET")o.headers={...(o.headers||{}),"Content-Type":"application/json","X-CSRF-Token":CSRF};let r=await fetch(u,o);if(r.status===401){location="/archive";throw 0}if(!r.ok)throw Error(await r.text());return r.json()}
async function load(){let ts=await api("/api/netops-library/templates");templates.innerHTML=ts.map(x=>"<tr><td>"+x.name+"</td><td>"+x.vendor+"</td><td>"+x.role+"</td><td><button onclick=\"delTemplate('"+x.id+"')\">Delete</button></td></tr>").join("");tsel.innerHTML=ts.filter(x=>x.enabled).map(x=>"<option value='"+x.id+"'>"+x.name+"</option>").join("");let ps=await api("/api/netops-library/policies");policies.innerHTML=ps.map(x=>"<tr><td>"+x.name+"</td><td>"+x.require_precheck+"</td><td>"+x.require_postcheck+"</td><td>"+x.require_rollback+"</td><td>"+x.blocked_patterns.join(", ")+"</td><td><button onclick=\"delPolicy('"+x.id+"')\">Delete</button></td></tr>").join("")}
async function addTemplate(){try{let body={name:tname.value,vendor:vendor.value||"any",role:role.value||"any",description:desc.value,precheck:tpre.value,change_commands:tchg.value,postcheck:tpost.value,rollback:trb.value,variables:vars.value.split(",").map(x=>x.trim()).filter(Boolean),enabled:true};await api("/api/netops-library/templates",{method:"POST",body:JSON.stringify(body)});tmsg.textContent="Saved";load()}catch(e){tmsg.textContent=e.message}}
async function delTemplate(id){await api("/api/netops-library/templates/"+id,{method:"DELETE"});load()}
async function renderTemplate(){try{let x=await api("/api/netops-library/templates/"+tsel.value+"/render",{method:"POST",body:JSON.stringify({values:values.value.trim()?JSON.parse(values.value):{}})});rendered.textContent="PRE-CHECK\n"+x.precheck+"\n\nCHANGE\n"+x.change_commands+"\n\nPOST-CHECK\n"+x.postcheck+"\n\nROLLBACK\n"+x.rollback}catch(e){rendered.textContent=e.message}}
async function addPolicy(){await api("/api/netops-library/policies",{method:"POST",body:JSON.stringify({name:pname.value,enabled:true,require_precheck:reqpre.checked,require_postcheck:reqpost.checked,require_rollback:reqrb.checked,blocked_patterns:blocked.value.split(",").map(x=>x.trim()).filter(Boolean)})});load()}
async function delPolicy(id){await api("/api/netops-library/policies/"+id,{method:"DELETE"});load()}
(async()=>{let m=await api("/api/auth/me");CSRF=m.csrf;if(!m.admin){document.body.innerHTML="Admin required";return}load()})()
</script></body></html>
