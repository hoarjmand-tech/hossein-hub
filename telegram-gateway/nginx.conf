server {
    listen 8081;
    server_name _;
    server_tokens off;
    client_max_body_size 100m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location = /telegram {
        proxy_pass http://archive:8080/telegram;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /telegram/ {
        proxy_pass http://archive:8080/telegram/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ^~ /api/telegram/ {
        proxy_pass http://archive:8080;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ^~ /s/ {
        proxy_pass http://archive:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ^~ /shared/ {
        proxy_pass http://archive:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /font-persian-regular.ttf {
        proxy_pass http://archive:8080/font-persian-regular.ttf;
        proxy_set_header Host $host;
    }

    location = /font-persian-bold.ttf {
        proxy_pass http://archive:8080/font-persian-bold.ttf;
        proxy_set_header Host $host;
    }

    location = /health {
        proxy_pass http://archive:8080/health;
    }

    location / {
        return 404;
    }
}
